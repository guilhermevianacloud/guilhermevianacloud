name: Caça ao Bug

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  jogar:
    if: startsWith(github.event.issue.title, 'caca-bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Processar jogada
        # Título e autor entram por variável de ambiente, nunca colados no script (evita injeção de comando).
        env:
          TITULO: ${{ github.event.issue.title }}
          AUTOR: ${{ github.event.issue.user.login }}
          SEMENTE: ${{ secrets.JOGO_SEMENTE }}
          RESPOSTA: ${{ runner.temp }}/resposta.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jogadas ao mesmo tempo disputam o push: quem perder refaz a jogada sobre o estado novo.
          ok=0
          for tentativa in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/jogo.mjs jogada
            git add README.md jogo cartoes/jogo-*.svg
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -q -m "jogo: jogada de $AUTOR"
            if git push -q origin HEAD:main; then ok=1; break; fi
            sleep $((RANDOM % 5 + 2))
          done
          [ "$ok" = 1 ]
      - name: Responder e fechar a issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --body-file "$RUNNER_TEMP/resposta.md"
          gh issue edit "$NUMERO" --add-label jogo || true
          gh issue close "$NUMERO"

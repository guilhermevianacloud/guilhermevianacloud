name: Atualizar cartões do perfil

on:
  schedule:
    - cron: "17 9 * * *" # todo dia às 06:17 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional: um token pessoal com leitura de repositórios inclui os privados nas linguagens.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: node scripts/gerar.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartoes
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza cartões do perfil"
          # Uma jogada do Caça ao Bug pode ter chegado antes; os arquivos não se cruzam, então o rebase é limpo.
          for tentativa in 1 2 3; do
            git pull -q --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

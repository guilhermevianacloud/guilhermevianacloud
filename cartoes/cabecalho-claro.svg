<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Guilherme Viana — pipeline do perfil">
<title>Guilherme Viana — pipeline do perfil</title>
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
  
  .digita { transform: translateX(560px); animation: digita 3.2s steps(46) 0.4s both; }
  @keyframes digita { from { transform: translateX(0); } to { transform: translateX(560px); } }
  .cursor { animation: pisca 1s step-end infinite; }
  @keyframes pisca { 50% { opacity: 0; } }
  .linha-viva { stroke-dasharray: 740; animation: corre 9s ease-in-out infinite; }
  @keyframes corre { 0% { stroke-dashoffset: 740; } 70%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 2.4s ease-out infinite; }
  @keyframes pulso { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
  .no0 { animation: acende0 9s ease-in-out infinite; }
  @keyframes acende0 { 0%, 0% { fill: #ffffff; } 2%, 96% { fill: #12a36b; } 100% { fill: #ffffff; } }
  .no1 { animation: acende1 9s ease-in-out infinite; }
  @keyframes acende1 { 0%, 17% { fill: #ffffff; } 20%, 96% { fill: #12a36b; } 100% { fill: #ffffff; } }
  .no2 { animation: acende2 9s ease-in-out infinite; }
  @keyframes acende2 { 0%, 34% { fill: #ffffff; } 37%, 96% { fill: #12a36b; } 100% { fill: #ffffff; } }
  .no3 { animation: acende3 9s ease-in-out infinite; }
  @keyframes acende3 { 0%, 52% { fill: #ffffff; } 55%, 96% { fill: #12a36b; } 100% { fill: #ffffff; } }
  .no4 { animation: acende4 9s ease-in-out infinite; }
  @keyframes acende4 { 0%, 69% { fill: #ffffff; } 72%, 96% { fill: #12a36b; } 100% { fill: #ffffff; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<clipPath id="dentro"><rect x="1" y="1" width="898" height="248" rx="13"/></clipPath>
<rect x="0.5" y="0.5" width="899" height="249" rx="14" fill="#ffffff" stroke="#d9dfea"/>
<g clip-path="url(#dentro)">
<circle cx="26" cy="26" r="5.5" fill="#ff5f57"/><circle cx="44" cy="26" r="5.5" fill="#febc2e"/><circle cx="62" cy="26" r="5.5" fill="#28c840"/>
<text x="84" y="30" class="mono" font-size="12" fill="#5b6782">pipeline: guilhermevianacloud / main</text>
<g transform="translate(750 14)">
  <rect width="124" height="24" rx="12" fill="none" stroke="#12a36b"/>
  <circle cx="16" cy="12" r="4" fill="#12a36b"/>
  <circle cx="16" cy="12" r="4" fill="#12a36b" class="pulso"/>
  <text x="28" y="16.5" class="mono" font-size="12" fill="#12a36b">em construção</text>
</g>
<text x="40" y="94" class="sans" font-size="40" font-weight="700" fill="#1b2333">Guilherme Viana</text>
<text x="42" y="124" class="sans" font-size="16" fill="#5b6782">Análise e Desenvolvimento de Sistemas · Senac  ·  suporte de TI  ·  qualidade de software</text>
<g>
  <text x="42" y="156" class="mono" font-size="15" fill="#3d63dd">&gt; java · spring boot · javascript · react native</text>
  <rect x="38" y="140" width="560" height="22" fill="#ffffff" class="digita"/>
</g>
<line x1="80" y1="196" x2="820" y2="196" stroke="#eef1f7" stroke-width="4" stroke-linecap="round"/>
<line x1="80" y1="196" x2="820" y2="196" stroke="#12a36b" stroke-width="4" stroke-linecap="round" class="linha-viva"/>
<circle cx="80" cy="196" r="10" fill="#12a36b" stroke="#12a36b" stroke-width="2.5" class="no0"/>
<text x="80" y="228" text-anchor="middle" class="mono" font-size="12" fill="#5b6782">estudar</text><circle cx="265" cy="196" r="10" fill="#12a36b" stroke="#12a36b" stroke-width="2.5" class="no1"/>
<text x="265" y="228" text-anchor="middle" class="mono" font-size="12" fill="#5b6782">codar</text><circle cx="450" cy="196" r="10" fill="#12a36b" stroke="#12a36b" stroke-width="2.5" class="no2"/>
<text x="450" y="228" text-anchor="middle" class="mono" font-size="12" fill="#5b6782">testar</text><circle cx="635" cy="196" r="10" fill="#12a36b" stroke="#12a36b" stroke-width="2.5" class="no3"/>
<text x="635" y="228" text-anchor="middle" class="mono" font-size="12" fill="#5b6782">revisar</text><circle cx="820" cy="196" r="10" fill="#12a36b" stroke="#12a36b" stroke-width="2.5" class="no4"/>
<text x="820" y="228" text-anchor="middle" class="mono" font-size="12" fill="#5b6782">entregar</text></g>
</svg>
